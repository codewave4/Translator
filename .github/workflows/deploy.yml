# دیپلوی خودکار روی GitHub Pages با هر پوش به برنچ main
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت کدها
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: نصب پکیج‌ها
        run: npm install

      - name: بیلد پروژه
        run: npm run build

      - name: آپلود خروجی
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: انتشار روی GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
